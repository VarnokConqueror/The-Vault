name: conquerors_court
description: "The Vault private messaging app."
publish_to: 'none'

version: 2.6.10

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  audioplayers: ^6.5.1
  uuid: ^4.5.2
  qr_flutter: ^4.1.0
  local_auth: ^2.2.0
  package_info_plus: ^4.0.0
  crypto: ^3.0.3
  mobile_scanner: ^5.1.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^19.0.0
  open_filex: ^4.7.0
  path_provider: ^2.1.2
  record: ^6.2.0
  flutter_webrtc: ^1.3.0
  web_socket_channel: ^3.0.3
  flutter_ringtone_player: ^4.0.0+4
  lottie: ^3.1.0
  image: ^4.2.0
  cryptography: ^2.9.0
  emoji_extension: ^1.3.0
  video_player: ^2.10.1
  photo_manager: ^3.7.1
  video_thumbnail: ^0.5.6
  url_launcher: ^6.3.1
  window_manager: ^0.3.8
  screen_protector: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/
    - assets/stickers/
