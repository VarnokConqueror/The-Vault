server {
    listen 80;
    listen [::]:80;
    server_name vault.theconquerorscourt.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vault.theconquerorscourt.com;

    root /var/www/vault.theconquerorscourt.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vault.theconquerorscourt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.theconquerorscourt.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /download {
        return 302 /downloads/the-vault-android.apk;
    }

    location = /download/windows {
        return 302 /downloads/the-vault-windows-setup.exe;
    }

    location = /download/android {
        return 302 /downloads/the-vault-android.apk;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location = /privacy-policy.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /privacy-policy.html =404;
    }

    location = /terms-of-service.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /terms-of-service.html =404;
    }

    location /downloads/ {
        alias /var/www/vault.theconquerorscourt.com/downloads/;
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream exe;
        }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment' always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
